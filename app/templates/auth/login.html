{% extends "base.html" %}
{% block title %}Login - GreenLeaf Grocers{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-leaf text-success" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">GreenLeaf Grocers</h3>
                    <p class="text-muted">Inventory & Sales Management</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required autofocus placeholder="admin or cashier1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-green w-100 btn-lg">Sign In</button>
                </form>
                <hr>
                <div class="small text-muted">
                    <strong>Demo accounts:</strong><br>
                    admin / admin123 (Admin)<br>
                    cashier1 / cash123 (Cashier)
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
